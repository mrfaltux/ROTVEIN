<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ROTVEIN — Jungle Swarm Survivor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#04100C;
  --moss:#0B241A;
  --lime:#B6FF2E;
  --amber:#FFB020;
  --rot:#C04BFF;
  --blood:#FF3A6E;
  --bone:#E8F5E4;
  --ui:'Chakra Petch',system-ui,sans-serif;
  --disp:'Barlow Condensed','Chakra Petch',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);font-family:var(--ui);color:var(--bone);overscroll-behavior:none;touch-action:none}
canvas{display:block;position:fixed;inset:0}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(2,12,8,.75) 100%)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 50%,rgba(255,58,110,0) 55%,rgba(255,58,110,.55) 100%);opacity:0;transition:opacity .18s}
.ui{position:fixed;z-index:5;pointer-events:none}

/* ---------- top bars ---------- */
#top{top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;flex-direction:column;gap:6px}
.bar{position:relative;height:14px;border:1.5px solid rgba(232,245,228,.28);background:rgba(4,16,12,.55);overflow:hidden;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .12s linear;display:block}
#hpf{background:linear-gradient(90deg,#FF3A6E,#FF7A4B)}
#xpf{background:linear-gradient(90deg,#2EE6FF,var(--lime))}
#xpbar{height:8px}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 10px/1 var(--ui);letter-spacing:.14em;text-shadow:0 1px 2px #000}
#statline{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--disp);letter-spacing:.06em}
#lvl{font-size:26px;color:var(--lime);text-shadow:0 0 14px rgba(182,255,46,.5)}
#clock{font-size:30px;font-variant-numeric:tabular-nums}
#kills{font-size:20px;color:var(--amber)}
.tag{font:600 9px/1 var(--ui);letter-spacing:.22em;opacity:.55;display:block}

#combo{position:fixed;top:32%;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;
  font-family:var(--disp);font-size:34px;color:var(--amber);opacity:0;text-shadow:0 0 18px rgba(255,176,32,.6)}

#warn{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;
  font:700 13px/1 var(--ui);letter-spacing:.2em;color:var(--rot);opacity:0;transition:opacity .3s;white-space:nowrap;
  text-shadow:0 0 14px rgba(192,75,255,.6)}

#bossw{position:fixed;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(420px,72vw);z-index:5;pointer-events:none;opacity:0;transition:opacity .3s}
#bossw .bar{height:9px;border-color:rgba(255,58,110,.5)}
#bossf{background:linear-gradient(90deg,#7A0D2A,var(--blood))}
#bossn{font:700 10px/1.6 var(--ui);letter-spacing:.24em;text-align:center;color:var(--blood)}

/* ---------- ability dock ---------- */
#dock{left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:6}
.slot{pointer-events:auto;width:62px;height:62px;position:relative;background:rgba(6,26,18,.72);
  border:1.5px solid rgba(232,245,228,.22);border-radius:2px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .15s,transform .1s;overflow:hidden}
.slot.on{border-color:var(--lime);box-shadow:0 0 0 1px rgba(182,255,46,.35),0 0 22px rgba(182,255,46,.2)}
.slot.empty{opacity:.28;border-style:dashed}
.slot:active{transform:scale(.94)}
.slot .glyph{width:26px;height:26px;opacity:.95}
.slot .cd{position:absolute;inset:0;background:rgba(2,10,7,.78);transform-origin:bottom}
.slot .k{position:absolute;top:2px;left:4px;font:600 9px var(--ui);opacity:.5}
.slot .nm{position:absolute;bottom:2px;left:0;right:0;text-align:center;font:600 7.5px var(--ui);letter-spacing:.1em;opacity:.7}
.slot .lv{position:absolute;top:2px;right:4px;font:700 9px var(--ui);color:var(--amber)}

#hint{bottom:calc(84px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:600 9.5px var(--ui);letter-spacing:.18em;opacity:.4}

/* ---------- joystick ---------- */
#stick{position:fixed;z-index:4;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;
  border:1.5px solid rgba(232,245,228,.16);opacity:0;transition:opacity .15s;pointer-events:none}
#stick div{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:rgba(182,255,46,.16);border:1.5px solid rgba(182,255,46,.5)}

/* ---------- overlays ---------- */
.screen{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(ellipse at 50% 40%,rgba(11,36,26,.86),rgba(2,9,6,.96));backdrop-filter:blur(3px);padding:20px}
.screen.show{display:flex}
h1{font-family:var(--disp);font-size:clamp(52px,13vw,120px);line-height:.84;letter-spacing:.02em;color:var(--bone)}
h1 span{color:var(--lime);text-shadow:0 0 30px rgba(182,255,46,.45)}
.sub{font:600 10px var(--ui);letter-spacing:.42em;opacity:.6;margin:14px 0 26px}
.btn{pointer-events:auto;font:700 13px var(--ui);letter-spacing:.2em;padding:14px 34px;color:var(--ink);background:var(--lime);
  border:0;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(2px)}
.keys{margin-top:26px;display:grid;grid-template-columns:auto auto;gap:6px 18px;font:600 10.5px var(--ui);opacity:.55;letter-spacing:.08em}
.keys b{color:var(--lime);font-weight:700}

#cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:940px}
.card{pointer-events:auto;width:min(240px,80vw);padding:20px 18px 22px;background:linear-gradient(180deg,rgba(11,36,26,.95),rgba(4,16,12,.95));
  border:1.5px solid rgba(232,245,228,.18);cursor:pointer;position:relative;transition:transform .12s,border-color .12s;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.card:hover{transform:translateY(-6px);border-color:var(--lime)}
.card .n{position:absolute;top:8px;right:11px;font:700 11px var(--ui);opacity:.35}
.card .ic{width:40px;height:40px;margin-bottom:14px}
.card h3{font-family:var(--disp);font-size:25px;line-height:1;letter-spacing:.02em;margin-bottom:8px}
.card p{font:500 11.5px/1.5 var(--ui);opacity:.68}
.card .kind{font:700 8.5px var(--ui);letter-spacing:.22em;margin-bottom:10px;color:var(--amber)}
.card.new .kind{color:var(--lime)}
#lvtitle{font-family:var(--disp);font-size:40px;letter-spacing:.03em;margin-bottom:4px}
#lvsub{font:600 9.5px var(--ui);letter-spacing:.3em;opacity:.5;margin-bottom:28px}

#stats{display:flex;gap:34px;margin:24px 0 30px;flex-wrap:wrap;justify-content:center}
#stats div{text-align:center}
#stats i{display:block;font-family:var(--disp);font-size:44px;font-style:normal;color:var(--lime);line-height:1}
#stats span{font:600 9px var(--ui);letter-spacing:.24em;opacity:.5}
#gotitle{color:var(--blood)}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:7;pointer-events:auto;background:none;border:0;
  color:var(--bone);opacity:.4;cursor:pointer;font:600 10px var(--ui);letter-spacing:.1em;padding:6px}
</style>
</head>
<body>
<div id="vig"></div><div id="hurt"></div>

<div class="ui" id="top">
  <div id="statline">
    <div><span class="tag">LEVEL</span><span id="lvl">1</span></div>
    <div style="text-align:center"><span class="tag">SURVIVED</span><span id="clock">0:00</span></div>
    <div style="text-align:right"><span class="tag">KILLS</span><span id="kills">0</span></div>
  </div>
  <div class="bar"><i id="hpf"></i><b id="hpt">100 / 100</b></div>
  <div class="bar" id="xpbar"><i id="xpf"></i></div>
</div>

<div id="bossw"><div id="bossn">APEX ORGANISM</div><div class="bar"><i id="bossf"></i></div></div>
<div id="combo"></div>
<div id="warn"></div>

<div class="ui" id="dock"></div>
<div class="ui" id="hint"></div>
<div id="stick"><div></div></div>
<button id="mute">SOUND ON</button>

<div class="screen show" id="start">
  <h1>ROT<span>VEIN</span></h1>
  <div class="sub">JUNGLE SWARM SURVIVOR</div>
  <button class="btn" id="play">ENTER THE CANOPY</button>
  <div class="keys" id="ctrls"></div>
</div>

<div class="screen" id="levelup">
  <div id="lvtitle">MUTATION</div>
  <div id="lvsub">ABSORB ONE STRAIN</div>
  <div id="cards"></div>
</div>

<div class="screen" id="gameover">
  <h1 id="gotitle">CONSUMED</h1>
  <div id="stats"></div>
  <button class="btn" id="again">GROW AGAIN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ROTVEIN — open-world 3rd-person jungle survivor
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const lerp = (a,b,t)=>a+(b-a)*t;
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const MAX_ENEMIES = IS_TOUCH ? 85 : 165;
const TILE = 230;                       // world wrap tile for endless scenery

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:!IS_TOUCH, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH?1.6:2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d2a1e);
scene.fog = new THREE.FogExp2(0x0d2a1e, 0.0145);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.5, 400);
scene.add(new THREE.HemisphereLight(0xa8ffd8, 0x0a1c12, 1.05));
const sun = new THREE.DirectionalLight(0xfff2cc, 0.85); sun.position.set(30,60,20); scene.add(sun);
const glow = new THREE.PointLight(0xb6ff2e, 1.1, 22, 2); scene.add(glow);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- ground ---------------- */
function groundTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  x.fillStyle='#123122'; x.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){
    const g=['#0e2619','#17402a','#1c4d31','#0b1f14','#204d2c'][rndi(0,4)];
    x.fillStyle=g; x.globalAlpha=rnd(.25,.8);
    x.beginPath(); x.ellipse(rnd(0,256),rnd(0,256),rnd(3,20),rnd(3,14),rnd(0,TAU),0,TAU); x.fill();
  }
  x.globalAlpha=.5;
  for(let i=0;i<40;i++){ x.fillStyle='#3a2c17'; x.beginPath(); x.ellipse(rnd(0,256),rnd(0,256),rnd(6,22),rnd(4,12),rnd(0,TAU),0,TAU); x.fill(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(220,220); return t;
}
const gTex = groundTexture();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2200,2200), new THREE.MeshLambertMaterial({map:gTex}));
ground.rotation.x = -Math.PI/2; scene.add(ground);

/* ---------------- endless scenery (instanced + wrapped) ---------------- */
const scenery = [];
function makeField(geo, mat, count, cfg){
  const im = new THREE.InstancedMesh(geo, mat, count);
  im.frustumCulled = false; scene.add(im);
  const items = [];
  for(let i=0;i<count;i++){
    items.push({
      x: rnd(-TILE/2,TILE/2), z: rnd(-TILE/2,TILE/2),
      y: cfg.y(), s: cfg.s(), r: rnd(0,TAU), t: rnd(0,TAU)
    });
  }
  scenery.push({im, items, cfg});
  return im;
}
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler(), P = new THREE.Vector3(), S = new THREE.Vector3();
function wrap(c, p){ let d=c-p; d=((d+TILE/2)%TILE+TILE)%TILE-TILE/2; return p+d; }

const barkM  = new THREE.MeshLambertMaterial({color:0x4a3520});
const leafM  = new THREE.MeshLambertMaterial({color:0x1d6b33, flatShading:true});
const leaf2M = new THREE.MeshLambertMaterial({color:0x2b8f3f, flatShading:true});
const bushM  = new THREE.MeshLambertMaterial({color:0x175229, flatShading:true});
const rockM  = new THREE.MeshLambertMaterial({color:0x4b5550, flatShading:true});
const grassM = new THREE.MeshLambertMaterial({color:0x2f7d3a, flatShading:true});

makeField(new THREE.CylinderGeometry(.45,.85,15,6), barkM, 150, {y:()=>7.5, s:()=>rnd(.7,1.5), sway:0});
makeField(new THREE.IcosahedronGeometry(3.4,0), leafM, 150, {y:()=>rnd(12,16), s:()=>rnd(.8,1.7), sway:.05});
makeField(new THREE.IcosahedronGeometry(2.6,0), leaf2M, 110, {y:()=>rnd(9,13), s:()=>rnd(.6,1.3), sway:.06});
makeField(new THREE.IcosahedronGeometry(1.3,0), bushM, 190, {y:()=>rnd(.5,1.1), s:()=>rnd(.6,1.6), sway:.03});
makeField(new THREE.DodecahedronGeometry(1.1,0), rockM, 55, {y:()=>rnd(.1,.5), s:()=>rnd(.5,1.7), sway:0});
makeField(new THREE.ConeGeometry(.5,1.6,4), grassM, 320, {y:()=>.8, s:()=>rnd(.5,1.3), sway:.12});

function updateScenery(px,pz,time){
  for(const f of scenery){
    for(let i=0;i<f.items.length;i++){
      const it=f.items[i];
      it.x = wrap(it.x, px); it.z = wrap(it.z, pz);
      const sway = f.cfg.sway ? Math.sin(time*1.1+it.t)*f.cfg.sway : 0;
      E.set(sway, it.r, sway*.7); Q.setFromEuler(E);
      P.set(it.x, it.y, it.z); S.set(it.s,it.s,it.s);
      M.compose(P,Q,S); f.im.setMatrixAt(i,M);
    }
    f.im.instanceMatrix.needsUpdate = true;
  }
}

/* ---------------- audio (tiny synth) ---------------- */
let AC=null, muted=false;
function sfx(freq, dur, type='square', vol=.06, slide=0){
  if(muted) return;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq, AC.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), AC.currentTime+dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur+.02);
}
document.getElementById('mute').onclick = e=>{
  muted=!muted; e.target.textContent = muted?'SOUND OFF':'SOUND ON'; e.target.style.opacity = muted?.2:.4;
};

/* ---------------- player ---------------- */
const player = new THREE.Group(); scene.add(player);
{
  const skin = new THREE.MeshLambertMaterial({color:0xd8a276});
  const cloth= new THREE.MeshLambertMaterial({color:0x2f6b4a});
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(.42,.34,1.15,8), cloth); torso.position.y=1.28; player.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.32,12,10), skin); head.position.y=2.12; player.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(.335,10,8,0,TAU,0,1.1), new THREE.MeshLambertMaterial({color:0x241a12}));
  hair.position.y=2.15; player.add(hair);
  const hip = new THREE.Mesh(new THREE.CylinderGeometry(.34,.28,.9,8), new THREE.MeshLambertMaterial({color:0x3a3021}));
  hip.position.y=.5; player.add(hip);
  player.legL = new THREE.Mesh(new THREE.CylinderGeometry(.13,.11,.95,6), skin); player.legL.position.set(-.17,.48,0); player.add(player.legL);
  player.legR = player.legL.clone(); player.legR.position.x=.17; player.add(player.legR);
  player.armL = new THREE.Mesh(new THREE.CylinderGeometry(.11,.1,.85,6), skin); player.armL.position.set(-.5,1.42,0); player.add(player.armL);
  player.armR = player.armL.clone(); player.armR.position.x=.5; player.add(player.armR);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(.09,.9,.22), new THREE.MeshLambertMaterial({color:0xb9c6bd}));
  blade.position.set(.56,1.05,.12); blade.rotation.z=.25; player.add(blade); player.blade=blade;
  const aura = new THREE.Mesh(new THREE.RingGeometry(.75,.95,24), new THREE.MeshBasicMaterial({color:0xb6ff2e,transparent:true,opacity:.35,side:THREE.DoubleSide}));
  aura.rotation.x=-Math.PI/2; aura.position.y=.06; player.add(aura); player.aura=aura;
}

/* ---------------- pools ---------------- */
function Pool(make){ const free=[], live=[]; return {
  free, live,
  get(){ const o = free.pop() || make(); live.push(o); o.mesh.visible=true; return o; },
  put(o){ o.mesh.visible=false; const i=live.indexOf(o); if(i>=0) live.splice(i,1); free.push(o); },
  each(fn){ for(let i=live.length-1;i>=0;i--) fn(live[i], i); }
};}

/* --- particles --- */
const partGeo = new THREE.OctahedronGeometry(.2,0);
const particles = Pool(()=>{ const m=new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({color:0xffffff,transparent:true})); scene.add(m); return {mesh:m,v:new THREE.Vector3()}; });
function burst(pos, color, n, spd, size, up){
  for(let i=0;i<n;i++){
    const p = particles.get();
    p.mesh.material.color.setHex(color); p.mesh.material.opacity=1;
    p.mesh.position.copy(pos); p.mesh.scale.setScalar(size*rnd(.6,1.4));
    p.v.set(rnd(-1,1),rnd(.2,1)*(up||1),rnd(-1,1)).normalize().multiplyScalar(spd*rnd(.5,1.3));
    p.life=rnd(.3,.7); p.max=p.life;
  }
}
function updateParticles(dt){
  particles.each(p=>{
    p.life-=dt; if(p.life<=0) return particles.put(p);
    p.v.y-=14*dt; p.mesh.position.addScaledVector(p.v,dt);
    const k=p.life/p.max; p.mesh.material.opacity=k; p.mesh.scale.setScalar(p.mesh.scale.x*(1-dt*.9));
  });
}

/* --- projectiles --- */
const shotGeo = new THREE.ConeGeometry(.16,.75,5);
const shots = Pool(()=>{ const m=new THREE.Mesh(shotGeo, new THREE.MeshBasicMaterial({color:0xb6ff2e})); scene.add(m); return {mesh:m,v:new THREE.Vector3(),hit:new Set()}; });
const eshotGeo = new THREE.IcosahedronGeometry(.28,0);
const eshots = Pool(()=>{ const m=new THREE.Mesh(eshotGeo, new THREE.MeshBasicMaterial({color:0xc04bff})); scene.add(m); return {mesh:m,v:new THREE.Vector3()}; });

/* --- xp orbs --- */
const orbGeo = new THREE.OctahedronGeometry(.3,0);
const orbMat = new THREE.MeshBasicMaterial({color:0x2ee6ff});
const orbMat2= new THREE.MeshBasicMaterial({color:0xb6ff2e});
const orbs = Pool(()=>{ const m=new THREE.Mesh(orbGeo, orbMat); scene.add(m); return {mesh:m,v:new THREE.Vector3()}; });

/* --- pickups --- */
const GOOD = [
  {id:'sun',   name:'SUNFRUIT',    color:0xffcc33, msg:'+HP'},
  {id:'power', name:'BLOOD BERRY', color:0xff4d4d, msg:'DAMAGE UP'},
  {id:'swift', name:'SWIFT NECTAR',color:0x2ee6ff, msg:'SPEED UP'},
  {id:'rage',  name:'RAGE BLOOM',  color:0xffb020, msg:'FRENZY'},
];
const BAD = [
  {id:'rot',   name:'ROT FUNGUS',  color:0x8b2ec9, msg:'ROTTEN'},
  {id:'venom', name:'VENOM POD',   color:0x6a1fb0, msg:'POISONED'},
  {id:'curse', name:'CURSED BLOOM',color:0xa03ad8, msg:'WEAKENED'},
];
const pickups = [];
function spawnPickup(kind){
  const g = new THREE.Group();
  const a = rnd(0,TAU), d = rnd(22,48);
  g.position.set(player.position.x+Math.cos(a)*d, 0, player.position.z+Math.sin(a)*d);
  let def, good;
  if(kind==='ability'){
    good=true; def={id:'ability',name:'SPORE CRYSTAL',color:0xb6ff2e,msg:'NEW POWER'};
    const c=new THREE.Mesh(new THREE.OctahedronGeometry(.62,0), new THREE.MeshBasicMaterial({color:0xd6ff7a}));
    c.position.y=1.1; g.add(c);

function buildEnemy(type){

  const bodyM = new THREE.MeshLambertMaterial({color:t.color, flatShading:true});

  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(.7,0), bodyM);
  body.scale.set(1,.72,1.35); body.position.y=.75; g.add(body);
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(.42,0), accM); head.position.set(0,.82,.9); g.add(head);
  g.body=body; g.head=head; g.mats=[bodyM,accM];
  if(type==='wasp'){
    const w1=new THREE.Mesh(new THREE.PlaneGeometry(1.5,.6), new THREE.MeshBasicMaterial({color:0xd9f2ff,transparent:true,opacity:.45,side:THREE.DoubleSide}));
    w1.position.set(-.7,1.15,0); const w2=w1.clone(); w2.position.x=.7; g.add(w1,w2); g.wings=[w1,w2];
    const st=new THREE.Mesh(new THREE.ConeGeometry(.16,.7,5), accM); st.position.set(0,.75,-1.1); st.rotation.x=Math.PI/2; g.add(st);
  } else {
    const legs = new THREE.Group();
    for(let i=0;i<6;i++){
      const l=new THREE.Mesh(new THREE.BoxGeometry(.11,.11,1.15), bodyM);
      const side = i%2?1:-1, row=Math.floor(i/2)-1;
      l.position.set(side*.6, .38, row*.5); l.rotation.y=side*.9; legs.add(l);
    }
    g.add(legs); g.legs=legs;
    if(type==='brute'||type==='apex'){
      const horn=new THREE.Mesh(new THREE.ConeGeometry(.28,1.4,6), accM);
      horn.position.set(0,1.15,1.1); horn.rotation.x=-.9; g.add(horn);

    const aura=new THREE.Mesh(new THREE.RingGeometry(1.2,1.5,24), new THREE.MeshBasicMaterial({color:0xff3a6e,transparent:true,opacity:.5,side:THREE.DoubleSide}));
    aura.rotation.x=-Math.PI/2; aura.position.y=.05; g.add(aura);
  }
  g.scale.setScalar(t.scale);
  scene.add(g); g.visible=false;
  return g;
}

function spawnEnemy(type, dist){
  if(enemies.length>=MAX_ENEMIES && !ETYPES[type].boss) return;
  const t=ETYPES[type];

  mesh.visible=true;

  mesh.position.set(player.position.x+Math.cos(a)*d, t.fly?2.4:0, player.position.z+Math.sin(a)*d);

    hp: t.hp*mul, max:t.hp*mul, spd:t.spd*(1+G.time/300)*rnd(.9,1.08),
    dmg:t.dmg*(1+G.time/110), xp:t.xp, flash:0, hitcd:0, stun:0, poison:0, ptick:0,
    shot: t.ranged? rnd(1,3):0, dead:0, bob:rnd(0,TAU), boss:!!t.boss
  };

}
function killEnemy(e, idx){
  burst(e.mesh.position, ETYPES[e.type].acc, e.boss?60:9, e.boss?16:8, e.boss?.55:.22);
  const n = e.boss? 24 : (e.type==='brute'?6:1);

}

/* ---------------- combat helpers ---------------- */
function fireShot(dir, dmg, spd, pierce, color, size){
  const s = shots.get();
  s.mesh.material.color.setHex(color||0xb6ff2e);
  s.mesh.scale.setScalar(size||1);
  s.mesh.position.copy(player.position); s.mesh.position.y=1.35;
  s.v.copy(dir).setY(0).normalize().multiplyScalar(spd);
  s.mesh.rotation.order='YZX';
  s.mesh.rotation.set(0, -Math.atan2(s.v.z, s.v.x), -Math.PI/2);
  s.dmg=dmg; s.pierce=pierce; s.life=2.1; s.hit.clear();
}
function nearestEnemy(maxD){
  let best=null, bd=maxD*maxD;
  for(const e of enemies){
    const d = e.mesh.position.distanceToSquared(player.position);
    if(d<bd){ bd=d; best=e; }
  }
  return best;
}
function hurtEnemy(e, dmg, noCrit){
  let d=dmg, crit=false;
  if(!noCrit && Math.random()<G.crit){ d*=G.critMul; crit=true; }
  e.hp-=d; e.flash=.14;
  if(crit) burst(e.mesh.position, 0xffffff, 4, 6, .18);
}
function autoAttack(dt){
  G.atkT-=dt;
  if(G.atkT>0) return;
  const t = nearestEnemy(G.range);
  if(!t) return;
  const dir = t.mesh.position.clone().sub(player.position).setY(0).normalize();
  const dmg = G.dmg*G.dmgMul();
  for(let i=0;i<G.shots;i++){
    const off = (i-(G.shots-1)/2)*.18;
    const a = Math.atan2(dir.z,dir.x)+off;
    fireShot(new THREE.Vector3(Math.cos(a),0,Math.sin(a)), dmg, G.projSpd, G.pierce, 0xb6ff2e, .9);
  }
  player.blade.rotation.z = -1.1;
  G.atkT = 1/(G.atkSpd*G.atkMul());
  sfx(660,.05,'triangle',.028,-260);
}
function dash(){
  if(G.dashT>0 || !G.alive) return;
  G.dashT = G.dashCd*G.cdMul; G.iframe=.42;
  const d = moveDir();
  if(d.lengthSq()<.01) d.set(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
  G.dashV = d.normalize().multiplyScalar(34); G.dashTime=.22;
  burst(player.position, 0xb6ff2e, 12, 6, .2);
  sfx(320,.16,'sine',.05,240);
}
function useAbility(i){
  const id = G.owned[i]; if(!id || !G.alive || G.paused) return;
  if((G.cds[id]||0) > 0) return;
  const a = ABIL[id], lv = G.lvls[id]||1;
  const t = nearestEnemy(40);
  let dir;
  if(IS_TOUCH || !hasMouseAim){
    dir = t? t.mesh.position.clone().sub(player.position).setY(0).normalize()
           : new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));
  } else {
    dir = aim.clone().sub(player.position).setY(0);
    if(dir.lengthSq()<.5) dir.set(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));
    dir.normalize();
  }
  a.use(lv, dir);
  G.cds[id] = abCd(id);
  G.shake = Math.max(G.shake,.25);
}
let hasMouseAim=false; addEventListener('mousemove',()=>hasMouseAim=true,{once:true});

}

  if(locked.length && (G.owned.length<2 || Math.random()<.4)){
    const id=pick(locked);
    out.push({new:true, kind:'NEW POWER', name:ABIL[id].name, desc:ABIL[id].desc, ic:ABIL[id].icon, run(){ grantAbility(id); }});
  }
  const owned = G.owned.slice().sort(()=>Math.random()-.5);
  for(const id of owned){
    if(out.length>=2) break;
    if(Math.random()<.42){
      const lv=(G.lvls[id]||1)+1;
      out.push({kind:'POWER RANK '+lv, name:ABIL[id].name, desc:'Stronger effect, shorter cooldown.', ic:ABIL[id].icon,
        run(){ G.lvls[id]=lv; }});
    }
  }
  const pool = UPGRADES.slice().sort(()=>Math.random()-.5);
  for(const u of pool){
    if(out.length>=3) break;
    if(out.some(o=>o.name===u.n)) continue;
    out.push({kind:'ADAPTATION', name:u.n, desc:u.d, ic:`<path d="${u.ic}" stroke="#ffb020" stroke-width="2" fill="none" stroke-linecap="round"/>`, run:u.apply});
  }
  return out.slice(0,3);
}
function grantAbility(id){
  if(G.owned.includes(id)){ G.lvls[id]=(G.lvls[id]||1)+1; }
  else { G.owned.push(id); G.lvls[id]=1; G.cds[id]=0; G.sel=G.owned.length-1; }
  buildDock();
}

/* ---------------- HUD ---------------- */
const hpf=document.getElementById('hpf'), hpt=document.getElementById('hpt'), xpf=document.getElementById('xpf'),
      lvlEl=document.getElementById('lvl'), clockEl=document.getElementById('clock'), killsEl=document.getElementById('kills'),
      dock=document.getElementById('dock'), hurtEl=document.getElementById('hurt'), comboEl=document.getElementById('combo'),
      warnEl=document.getElementById('warn'), bossw=document.getElementById('bossw'), bossf=document.getElementById('bossf'),
      lvup=document.getElementById('levelup'), cardsEl=document.getElementById('cards'), goEl=document.getElementById('gameover'),
      hintEl=document.getElementById('hint');

function svg(inner, size){ return `<svg class="${size}" viewBox="0 0 24 24" fill="none">${inner}</svg>`; }
function buildDock(){
  dock.innerHTML='';
  const n = Math.max(4, G.owned.length);
  for(let i=0;i<n;i++){
    const id=G.owned[i], el=document.createElement('div');
    el.className='slot'+(id?'':' empty')+(i===G.sel&&id?' on':'');
    if(id){
      const a=ABIL[id];
      el.innerHTML = `<div class="cd" data-cd="${id}"></div>${svg(a.icon,'glyph')}<span class="k">${i+1}</span><span class="lv">${G.lvls[id]>1?'R'+G.lvls[id]:''}</span><span class="nm">${a.name.split(' ')[0]}</span>`;
      el.onclick = ()=>{ G.sel=i; buildDock(); useAbility(i); };
    } else {
      el.innerHTML = `<span class="k">${i+1}</span><span class="nm">LOCKED</span>`;
    }
    dock.appendChild(el);
  }
}
function flash(msg){
  warnEl.textContent=msg; warnEl.style.opacity=1;
  clearTimeout(flash.t); flash.t=setTimeout(()=>warnEl.style.opacity=0,1400);
}
function updateHUD(){
  hpf.style.transform=`scaleX(${clamp(G.hp/G.maxHp,0,1)})`;
  hpt.textContent=`${Math.ceil(G.hp)} / ${G.maxHp}`;
  xpf.style.transform=`scaleX(${clamp(G.xp/G.xpNext,0,1)})`;
  lvlEl.textContent=G.level; killsEl.textContent=G.kills;
  const m=Math.floor(G.time/60), s=Math.floor(G.time%60);
  clockEl.textContent=`${m}:${s<10?'0':''}${s}`;
  document.querySelectorAll('.cd').forEach(el=>{
    const id=el.dataset.cd;
    el.style.transform=`scaleY(${clamp((G.cds[id]||0)/abCd(id),0,1)})`;
  });
  if(G.boss) bossf.style.transform=`scaleX(${clamp(G.boss.hp/G.boss.max,0,1)})`;
  if(G.combo>4){ comboEl.textContent=`${G.combo}× SWARM`; comboEl.style.opacity=clamp(G.comboT/2.2,0,1); }
  else comboEl.style.opacity=0;
}

/* ---------------- level up ---------------- */
let curCards=[];
function levelUp(){
  G.level++; G.xp-=G.xpNext; G.xpNext=Math.round(6+G.level*4.2+G.level*G.level*.28);
  G.hp=Math.min(G.maxHp, G.hp+6);
  sfx(880,.25,'triangle',.07,420);
  curCards = rollCards();
  cardsEl.innerHTML='';
  curCards.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='card'+(c.new?' new':'');
    el.innerHTML=`<span class="n">${i+1}</span><div class="kind">${c.kind}</div>${svg(c.ic,'ic')}<h3>${c.name}</h3><p>${c.desc}</p>`;
    el.onclick=()=>chooseCard(i);
    cardsEl.appendChild(el);
  });
  G.paused=true; lvup.classList.add('show');
}
function chooseCard(i){
  if(!lvup.classList.contains('show')||!curCards[i]) return;
  curCards[i].run(); lvup.classList.remove('show'); G.paused=false; buildDock();
  sfx(520,.12,'square',.05,200);
  if(G.xp>=G.xpNext) levelUp();
}

/* ---------------- flow ---------------- */
function die(){
  G.alive=false; G.paused=true;
  document.getElementById('stats').innerHTML=
    `<div><i>${clockEl.textContent}</i><span>SURVIVED</span></div>
     <div><i>${G.level}</i><span>LEVEL</span></div>
     <div><i>${G.kills}</i><span>KILLS</span></div>`;
  goEl.classList.add('show');
  sfx(90,1.1,'sawtooth',.1,-60);
}
function clearWorld(){
  for(let i=enemies.length-1;i>=0;i--){ enemies[i].mesh.visible=false; enemyPools[enemies[i].type].push(enemies[i].mesh); }
  enemies.length=0;
  shots.each(s=>shots.put(s)); eshots.each(s=>eshots.put(s)); orbs.each(o=>orbs.put(o)); particles.each(p=>particles.put(p));
  pickups.forEach(p=>scene.remove(p.mesh)); pickups.length=0;
  novas.forEach(n=>scene.remove(n.mesh)); novas.length=0;
  waves.forEach(w=>scene.remove(w.mesh)); waves.length=0;
  snares.forEach(s=>scene.remove(s.mesh)); snares.length=0;
  bolts.forEach(b=>scene.remove(b.mesh)); bolts.length=0;
}
function restart(){
  clearWorld();
  Object.assign(G,{ time:0,kills:0,combo:0,comboT:0,alive:true,paused:false,boss:null,level:1,xp:0,xpNext:6,
    hp:100,maxHp:100,dmg:11,atkSpd:1.7,range:17,projSpd:38,pierce:0,shots:1,crit:.05,critMul:2.1,
    speed:9.2,magnet:4.2,regen:0,cdMul:1,dashCd:2.6,dashT:0,dashTime:0,iframe:0,atkT:0,sel:0,shake:0,slow:1,
    nextSpawn:0,nextPickup:5,nextBad:3,nextElite:52,nextBoss:170,buffs:{},cds:{},lvls:{} });
  G.owned=[]; grantAbility('volley');
  player.position.set(0,0,0); bossw.style.opacity=0;
  goEl.classList.remove('show'); document.getElementById('start').classList.remove('show');
  hintEl.textContent = IS_TOUCH ? 'HOLD ANYWHERE TO MOVE · TAP A POWER TO CAST · SECOND FINGER DODGES'
                                : 'WASD MOVE · SPACE OR CLICK CASTS · 1–5 SWITCH · SHIFT DODGES';
}
document.getElementById('play').onclick = ()=>{ restart(); sfx(440,.2,'triangle',.06,300); };
document.getElementById('again').onclick = restart;
document.getElementById('ctrls').innerHTML = IS_TOUCH
  ? `<b>HOLD</b><span>anywhere to move</span><b>TAP POWER</b><span>cast ability</span><b>2nd FINGER</b><span>dodge dash</span><b>AUTO</b><span>you attack on your own</span><b>GOLD</b><span>safe to eat</span><b>PURPLE</b><span>never eat</span>`
  : `<b>WASD / ARROWS</b><span>move &amp; dodge</span><b>SPACE / CLICK</b><span>cast selected power</span><b>1 – 5</b><span>switch power</span><b>SHIFT / RIGHT-CLICK</b><span>dash</span><b>MOUSE</b><span>aim</span><b>GOLD PICKUPS</b><span>eat these</span><b>PURPLE FUNGUS</b><span>never eat these</span>`;
buildDock();

/* ---------------- movement dir ---------------- */
function moveDir(){
  const v=new THREE.Vector3();
  if(keys.KeyW||keys.ArrowUp) v.z-=1;
  if(keys.KeyS||keys.ArrowDown) v.z+=1;
  if(keys.KeyA||keys.ArrowLeft) v.x-=1;
  if(keys.KeyD||keys.ArrowRight) v.x+=1;
  if(move.lengthSq()>.01){ v.x+=move.x; v.z+=move.y; }
  return v.lengthSq()>1 ? v.normalize() : v;
}

/* ---------------- spawn director ---------------- */
function director(dt){
  G.nextSpawn-=dt;
  if(G.nextSpawn<=0){
    const rate = clamp(1.35 - G.time/150, .16, 1.35);
    G.nextSpawn = rate*rnd(.7,1.3);
    const t=G.time;
    let type='crawler';
    const r=Math.random();
    if(t>28 && r<.26) type='wasp';
    else if(t>50 && r<.44) type='spitter';
    else if(t>95 && r<.5) type='brute';
    const n = 1 + Math.floor(G.time/70);
    for(let i=0;i<n;i++) spawnEnemy(type);
  }
  if(G.time>G.nextElite){ G.nextElite += rnd(42,62); for(let i=0;i<3;i++) spawnEnemy('brute'); flash('HEAVY SHELLS INCOMING'); }
  if(G.time>G.nextBoss){ G.nextBoss += 175; spawnEnemy('apex', 30); }
  G.nextPickup-=dt;
  if(G.nextPickup<=0){ G.nextPickup=rnd(9,15); spawnPickup(Math.random()<.24?'ability':'good'); }
  G.nextBad-=dt;
  if(G.nextBad<=0){ G.nextBad=rnd(6,11); spawnPickup('bad'); }
}

/* ---------------- pickup effects ---------------- */
function eat(p){
  const d=p.def;
  burst(p.mesh.position, d.color, 16, 7, .25, 1);
  if(p.good){
    if(d.id==='ability'){
      const locked = ABIL_KEYS.filter(k=>!G.owned.includes(k));
      grantAbility(locked.length? pick(locked) : pick(G.owned));
      flash('POWER ABSORBED — '+ABIL[G.owned[G.owned.length-1]].name);
    }
    else if(d.id==='sun'){ G.hp=Math.min(G.maxHp,G.hp+34); flash('+34 HEALTH'); }
    else if(d.id==='power'){ G.buffs.power=13; flash('DAMAGE SURGE'); }
    else if(d.id==='swift'){ G.buffs.swift=11; flash('SWIFT BLOOD'); }
    else if(d.id==='rage'){ G.buffs.rage=9; flash('FRENZY'); }
    sfx(760,.16,'triangle',.06,320);
  } else {
    if(d.id==='rot'){ hurtPlayer(18); G.buffs.rot=5; flash('ROTTEN — SLOWED'); }
    else if(d.id==='venom'){ G.buffs.venom=7; flash('POISONED'); }
    else if(d.id==='curse'){ G.buffs.curse=9; flash('WEAKENED'); }
    sfx(120,.3,'sawtooth',.07,-60);
  }
}

/* ---------------- main loop ---------------- */
const clock = new THREE.Clock();
const camOff = new THREE.Vector3(0,11.5,13.5);
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
let camPos = new THREE.Vector3(0,12,14);

function tick(){
  requestAnimationFrame(tick);
  const raw = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  if(!G.paused && G.alive) step(raw);

  /* camera follow (always, so menus still look alive) */
  tmp.copy(player.position).add(camOff);
  camPos.lerp(tmp, 1-Math.pow(.0016, raw));
  camera.position.copy(camPos);
  if(G.shake>0){
    camera.position.x+=rnd(-1,1)*G.shake; camera.position.y+=rnd(-1,1)*G.shake*.6; camera.position.z+=rnd(-1,1)*G.shake;
    G.shake=Math.max(0,G.shake-raw*2.4);
  }
  camera.lookAt(player.position.x, player.position.y+1.6, player.position.z-1.5);

  ground.position.set(player.position.x,0,player.position.z);
  gTex.offset.set(player.position.x/10, -player.position.z/10);
  updateScenery(player.position.x, player.position.z, t);
  glow.position.set(player.position.x, 4, player.position.z);

  /* aim ray */
  ray.setFromCamera(ndc, camera);
  ray.ray.intersectPlane(plane, aim);

  updateHUD();
  renderer.render(scene, camera);
}

function step(dt){
  G.time+=dt;
  director(dt);

  /* ---- buffs ---- */
  for(const k in G.buffs){ G.buffs[k]-=dt; if(G.buffs[k]<=0) delete G.buffs[k]; }
  if(G.buffs.venom) G.hp-=3.5*dt;
  if(G.regen) G.hp=Math.min(G.maxHp, G.hp+G.regen*dt);
  if(G.hp<=0){ G.hp=0; die(); return; }
  if(G.iframe>0) G.iframe-=dt;
  if(G.dashT>0) G.dashT-=dt;
  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0) G.combo=0; }
  for(const id of G.owned) if(G.cds[id]>0) G.cds[id]-=dt;

  /* ---- movement ---- */
  const dir = moveDir();
  let sp = G.speed*G.spdMul();
  if(G.dashTime>0){
    G.dashTime-=dt;
    player.position.addScaledVector(G.dashV, dt*(G.dashTime/.22+.35));
  } else if(dir.lengthSq()>0){
    player.position.addScaledVector(dir, sp*dt);
  }
  if(dir.lengthSq()>0){
    const want = Math.atan2(dir.x, dir.z);
    let diff = ((want-player.rotation.y+Math.PI*3)%TAU)-Math.PI;
    player.rotation.y += diff*Math.min(1, dt*16);
    const w = G.time*11;
    player.legL.rotation.x = Math.sin(w)*.7; player.legR.rotation.x=-Math.sin(w)*.7;
    player.armL.rotation.x = -Math.sin(w)*.5;
    player.position.y = Math.abs(Math.sin(w))*.06;
  } else {
    player.legL.rotation.x*=.85; player.legR.rotation.x*=.85; player.armL.rotation.x*=.85;
    player.position.y = Math.sin(G.time*2.4)*.03;
  }
  player.blade.rotation.z = lerp(player.blade.rotation.z, .25, dt*7);
  player.aura.material.opacity = G.iframe>0? .8 : .18+Math.sin(G.time*4)*.06;
  player.aura.scale.setScalar(G.magnet/4.2);

  autoAttack(dt);

  /* ---- enemies ---- */
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i], m=e.mesh, T=ETYPES[e.type];
    if(e.hp<=0){ killEnemy(e,i); continue; }
    if(e.poison>0){ e.poison-=dt; e.ptick-=dt; if(e.ptick<=0){ e.ptick=.5; e.hp-=e.pdmg; e.flash=.1; } }
    if(e.stun>0){ e.stun-=dt; }
    else {
      tmp.copy(player.position).sub(m.position); tmp.y=0;
      const d = tmp.length(); tmp.normalize();
      // separation
      tmp2.set(0,0,0);
      for(let j=0;j<enemies.length;j+=1){
        if(j===i) continue;
        const o=enemies[j];
        const dx=m.position.x-o.mesh.position.x, dz=m.position.z-o.mesh.position.z;
        const dd=dx*dx+dz*dz, rr=(e.r+o.r)*(e.r+o.r);
        if(dd<rr && dd>0.0001){ const inv=1/Math.sqrt(dd); tmp2.x+=dx*inv; tmp2.z+=dz*inv; }
      }
      if(tmp2.lengthSq()>0) tmp2.normalize().multiplyScalar(.75);
      let sp2=e.spd*(G.buffs.rage?1:1);
      if(T.ranged && d<12) sp2*=-.35;                    // spitters kite
      m.position.x += (tmp.x*sp2+tmp2.x*e.spd*.6)*dt;
      m.position.z += (tmp.z*sp2+tmp2.z*e.spd*.6)*dt;
      m.rotation.y = Math.atan2(tmp.x, tmp.z);
      if(T.fly){ e.bob+=dt*8; m.position.y = 2.2+Math.sin(e.bob)*.5; if(m.wings){ m.wings[0].rotation.z=Math.sin(e.bob*4)*.9; m.wings[1].rotation.z=-Math.sin(e.bob*4)*.9; } }
      else { e.bob+=dt*e.spd*1.6; m.position.y = Math.abs(Math.sin(e.bob))*.12; if(m.legs) m.legs.rotation.z=Math.sin(e.bob)*.16; }
      if(T.ranged){
        e.shot-=dt;
        if(e.shot<=0 && d<24){
          e.shot=rnd(2,3.4);
          const s=eshots.get(); s.mesh.position.copy(m.position); s.mesh.position.y=1.1;
          s.v.copy(tmp).multiplyScalar(15); s.dmg=e.dmg*.75; s.life=3;
        }
      }
      // contact damage
      if(d < e.r+.9){
        e.hitcd-=dt;
        if(e.hitcd<=0){ e.hitcd=.7; hurtPlayer(e.dmg); }
      }
    }
    if(e.flash>0){
      e.flash-=dt;
      const k=e.flash>0?clamp(e.flash/.14,0,1):0;
      m.mats[0].emissive.setRGB(k,k*.45,k*.45);
      m.mats[1].emissive.setRGB(k*.8,k*.35,k*.35);
    }
    // despawn far strays
    if(m.position.distanceToSquared(player.position) > 130*130 && !e.boss){ m.visible=false; enemyPools[e.type].push(m); enemies.splice(i,1); }
  }

  /* ---- player shots ---- */
  shots.each(s=>{
    s.life-=dt; if(s.life<=0) return shots.put(s);
    s.mesh.position.addScaledVector(s.v, dt);
    for(const e of enemies){
      if(s.hit.has(e.id)) continue;
      if(s.mesh.position.distanceToSquared(e.mesh.position) < (e.r+.55)*(e.r+.55)){
        s.hit.add(e.id); hurtEnemy(e, s.dmg);
        burst(s.mesh.position, 0xb6ff2e, 3, 5, .16);
        if(s.hit.size > s.pierce) return shots.put(s);
      }
    }
  });
  /* ---- enemy shots ---- */
  eshots.each(s=>{
    s.life-=dt; if(s.life<=0) return eshots.put(s);
    s.mesh.position.addScaledVector(s.v, dt);
    s.mesh.rotation.x+=dt*6; s.mesh.rotation.y+=dt*5;
    if(s.mesh.position.distanceToSquared(player.position) < 1.5){ hurtPlayer(s.dmg); eshots.put(s); }
  });

  /* ---- novas ---- */
  for(let i=novas.length-1;i>=0;i--){
    const n=novas[i]; n.r += dt*26;
    n.mesh.position.set(n.pos.x,.4,n.pos.z); n.mesh.scale.setScalar(n.r);
    n.mesh.material.opacity = clamp(1-n.r/n.max,0,1)*.85;
    for(const e of enemies){
      if(n.hit.has(e.id)) continue;
      const d=e.mesh.position.distanceTo(n.pos);
      if(d < n.r){
        n.hit.add(e.id); hurtEnemy(e, n.dmg);
        tmp.copy(e.mesh.position).sub(n.pos).setY(0).normalize().multiplyScalar(2.6);
        e.mesh.position.add(tmp);
      }
    }
    if(n.r>=n.max){ scene.remove(n.mesh); novas.splice(i,1); }
  }
  /* ---- ember waves ---- */
  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i]; w.t+=dt; w.pos.addScaledVector(w.dir, 16*dt);
    w.mesh.position.set(w.pos.x,1.2,w.pos.z);
    w.mesh.scale.set(w.w,1,1);
    w.mesh.rotation.y = Math.atan2(w.dir.x,w.dir.z)+Math.PI/2;
    w.mesh.material.opacity = clamp(1-w.t/w.life,0,1)*.8;
    if(Math.random()<.6) burst(w.mesh.position, 0xff7a2b, 1, 3, .2);
    for(const e of enemies){
      if(w.hit.has(e.id)) continue;
      if(e.mesh.position.distanceTo(w.pos) < w.w*.55+e.r){ w.hit.add(e.id); hurtEnemy(e,w.dmg); e.poison=2.5; e.pdmg=w.dmg*.16; }
    }
    if(w.t>=w.life){ scene.remove(w.mesh); waves.splice(i,1); }
  }
  /* ---- vines ---- */
  for(let i=snares.length-1;i>=0;i--){
    const s=snares[i]; s.t+=dt; s.tick-=dt;
    s.mesh.position.set(s.pos.x,0,s.pos.z);
    s.mesh.children.forEach((c,k)=>{ if(k) c.scale.y = .6+Math.sin(s.t*6+k)*.35; });
    if(s.tick<=0){
      s.tick=.45;
      for(const e of enemies){
        if(e.mesh.position.distanceTo(s.pos)<s.r+e.r){ hurtEnemy(e,s.dmg,true); e.stun=Math.max(e.stun,.5); }
      }
    }
    if(s.t>=s.life){ scene.remove(s.mesh); snares.splice(i,1); }
  }
  /* ---- lightning ---- */
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i]; b.t+=dt; b.mesh.material.opacity=1-b.t/.22;
    if(b.t>=.22){ scene.remove(b.mesh); bolts.splice(i,1); }
  }

  /* ---- orbs ---- */
  orbs.each(o=>{
    o.t+=dt;
    const d = o.mesh.position.distanceTo(player.position);
    if(d < G.magnet){
      tmp.copy(player.position).sub(o.mesh.position).normalize();
      o.mesh.position.addScaledVector(tmp, (16+ (G.magnet-d)*4)*dt);
    } else {
      o.v.y-=22*dt; o.mesh.position.addScaledVector(o.v,dt);
      if(o.mesh.position.y<.4){ o.mesh.position.y=.4; o.v.set(0,0,0); }
    }
    o.mesh.rotation.y+=dt*4; o.mesh.rotation.x+=dt*2;
    if(d<1.1){
      orbs.put(o); G.xp+=o.value;
      sfx(1100+rnd(-80,80),.04,'sine',.02);
      if(G.xp>=G.xpNext) levelUp();
    }
  });

  /* ---- pickups ---- */
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i]; p.t+=dt; p.life-=dt;
    p.mesh.rotation.y+=dt*1.4;
    p.mesh.position.y = Math.sin(p.t*2)*.16;
    if(p.mesh.spin) p.mesh.spin.rotation.z+=dt*2.5;
    if(p.mesh.position.distanceTo(player.position) < 1.6){
      eat(p); scene.remove(p.mesh); pickups.splice(i,1); continue;
    }
    if(p.life<=0 || p.mesh.position.distanceToSquared(player.position)>120*120){ scene.remove(p.mesh); pickups.splice(i,1); }
  }

  updateParticles(dt);
}
tick();
</script>
