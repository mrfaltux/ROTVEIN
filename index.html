<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ROTVEIN — Jungle Swarm Survivor</title>
<meta name="description" content="ROTVEIN — a 3D open-world jungle swarm survivor. Sixteen creatures, sixteen tactics, seven powers, seven languages.">
<meta name="theme-color" content="#04100C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/base.css">
<link rel="stylesheet" href="src/css/hud.css">
<link rel="stylesheet" href="src/css/screens.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='20'>🪲</text></svg>">
</head>
<body>
<div id="vig"></div><div id="hurt"></div>

<div class="ui" id="top">
  <div id="statline">
    <div><span class="tag" data-i18n="ui.level">LEVEL</span><span id="lvl">1</span></div>
    <div style="text-align:center"><span class="tag" data-i18n="ui.survived">SURVIVED</span><span id="clock">0:00</span></div>
    <div style="text-align:right"><span class="tag" data-i18n="ui.kills">KILLS</span><span id="kills">0</span></div>
  </div>
  <div class="bar"><i id="hpf"></i><b id="hpt">100 / 100</b></div>
  <div class="bar" id="xpbar"><i id="xpf"></i></div>
  <div id="status"></div>
</div>

<div id="bossw"><div id="bossn">APEX ORGANISM</div><div class="bar"><i id="bossf"></i></div></div>
<div id="combo"></div>
<div id="warn"></div>
<div id="threat"></div>

<div class="ui" id="dock"></div>
<div class="ui" id="hint"></div>
<div id="stick"><div></div></div>
<div id="topright">
  <button id="pausebtn" class="mini" data-i18n="ui.pause">PAUSE</button>
  <button id="mute" class="mini" data-i18n="ui.soundOn">SOUND ON</button>
</div>

<!-- ---------------- start ---------------- -->
<div class="screen show" id="start">
  <h1><span id="t1">ROT</span><span id="t2">VEIN</span></h1>
  <div class="sub" id="startsub" data-i18n="start.sub">JUNGLE SWARM SURVIVOR</div>
  <div class="row">
    <button class="btn" id="play" data-i18n="start.play">ENTER THE CANOPY</button>
    <button class="btn ghost" id="openbest" data-i18n="start.bestiary">BESTIARY</button>
  </div>
  <div id="langpick"><span class="tag" data-i18n="start.language">LANGUAGE</span><div id="langs"></div></div>
  <div class="keys" id="ctrls"></div>
</div>

<!-- ---------------- level up ---------------- -->
<div class="screen" id="levelup">
  <div id="lvtitle" data-i18n="levelup.title">MUTATION</div>
  <div id="lvsub" data-i18n="levelup.sub">ABSORB ONE STRAIN</div>
  <div id="cards"></div>
</div>

<!-- ---------------- bestiary ---------------- -->
<div class="screen" id="bestiary">
  <div id="besttitle" data-i18n="bestiary.title">BESTIARY</div>
  <div id="bestsub" data-i18n="bestiary.sub">EVERY CREATURE HUNTS DIFFERENTLY</div>
  <div id="bestlist"></div>
  <button class="btn" id="bestclose" data-i18n="ui.back">BACK</button>
</div>

<!-- ---------------- pause ---------------- -->
<div class="screen" id="pause">
  <div id="lvtitle" data-i18n="pause.title">HELD BREATH</div>
  <div class="row">
    <button class="btn" id="resume" data-i18n="pause.resume">RESUME</button>
    <button class="btn ghost" id="pausebest" data-i18n="start.bestiary">BESTIARY</button>
    <button class="btn ghost" id="quit" data-i18n="pause.quit">ABANDON</button>
  </div>
</div>

<!-- ---------------- game over ---------------- -->
<div class="screen" id="gameover">
  <h1 id="gotitle" data-i18n="gameover.title">CONSUMED</h1>
  <div id="stats"></div>
  <div id="killedby"></div>
  <button class="btn" id="again" data-i18n="gameover.again">GROW AGAIN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="src/js/main.js"></script>
<noscript><p style="padding:24px">ROTVEIN needs JavaScript and WebGL.</p></noscript>
</body>
</html>
